<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">How Body Data Enter a Gender Reading Model</title>
  <desc id="desc">Image 1 for “What Difference Can a Dress Make?” A simplified flowchart connecting data sources, simulated body space, reading models, scenario comparison, and interpretive focus.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#20345b" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="greenWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf5"/>
      <stop offset="1" stop-color="#edf5e9"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#ebf3fb"/>
    </linearGradient>
    <linearGradient id="violetWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#f0ecfa"/>
    </linearGradient>
    <linearGradient id="orangeWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#fbf0df"/>
    </linearGradient>
    <linearGradient id="tealWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbfc"/>
      <stop offset="1" stop-color="#e8f4f5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L22,11 L0,22 Z" fill="#294a78"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#fbfaf8"/>

  <g text-anchor="middle">
    <text x="800" y="92" fill="#12284a" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">
      How Body Data Enter a “Gender Reading” Model
    </text>
    <line x1="540" y1="150" x2="600" y2="150" stroke="#7387a4" stroke-width="2"/>
    <circle cx="600" cy="150" r="3" fill="#7387a4"/>
    <text x="800" y="165" fill="#425573" font-family="Arial, Helvetica, sans-serif" font-size="34">
      A Simplified Flowchart
    </text>
    <circle cx="1000" cy="150" r="3" fill="#7387a4"/>
    <line x1="1000" y1="150" x2="1060" y2="150" stroke="#7387a4" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="35" y="220" width="330" height="390" rx="24" fill="url(#greenWash)" stroke="#2e8139" stroke-width="2"/>
    <rect x="430" y="220" width="330" height="390" rx="24" fill="url(#blueWash)" stroke="#4389d0" stroke-width="2"/>
    <rect x="825" y="220" width="330" height="390" rx="24" fill="url(#violetWash)" stroke="#7458bc" stroke-width="2"/>
    <rect x="1220" y="220" width="345" height="390" rx="24" fill="url(#orangeWash)" stroke="#e39115" stroke-width="2"/>
    <rect x="490" y="700" width="700" height="220" rx="24" fill="url(#tealWash)" stroke="#14758a" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#294a78" stroke-width="3" marker-end="url(#arrow)">
    <path d="M374 410 H416"/>
    <path d="M769 410 H811"/>
    <path d="M1164 410 H1206"/>
    <path d="M1392 620 V664 Q1392 684 1372 684 H1265 Q1245 684 1245 704 V758 Q1245 774 1229 774 H1202"/>
  </g>

  <!-- Data Sources icon -->
  <g transform="translate(200 292)">
    <circle r="64" fill="#e4efdf" stroke="#ffffff" stroke-width="2"/>
    <g transform="rotate(-32)" stroke="#2e8139" stroke-width="4" fill="#ffffff">
      <rect x="-48" y="-18" width="96" height="36" rx="3"/>
      <line x1="-35" y1="-17" x2="-35" y2="-5"/>
      <line x1="-23" y1="-17" x2="-23" y2="-9"/>
      <line x1="-11" y1="-17" x2="-11" y2="-5"/>
      <line x1="1" y1="-17" x2="1" y2="-9"/>
      <line x1="13" y1="-17" x2="13" y2="-5"/>
      <line x1="25" y1="-17" x2="25" y2="-9"/>
      <line x1="37" y1="-17" x2="37" y2="-5"/>
      <line x1="-43" y1="25" x2="50" y2="25"/>
    </g>
  </g>

  <!-- Simulated Body Space icon -->
  <g transform="translate(595 292)">
    <circle r="64" fill="#deebf7" stroke="#ffffff" stroke-width="2"/>
    <g stroke="#2f78b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="#3f86c3">
      <circle cx="0" cy="-30" r="10"/>
      <path d="M-14 -12 Q0 -20 14 -12 L20 24 M14 -8 L12 52 M-14 -8 L-12 52 M-20 24 L-14 -12"/>
      <path d="M-33 -22 Q-50 0 -38 25" fill="none" stroke-dasharray="8 9"/>
      <path d="M33 -22 Q50 0 38 25" fill="none" stroke-dasharray="8 9"/>
    </g>
  </g>

  <!-- Reading Models icon -->
  <g transform="translate(990 292)">
    <circle r="64" fill="#e8e1f5" stroke="#ffffff" stroke-width="2"/>
    <g stroke="#6144aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-42" y="-31" width="84" height="58" rx="3" fill="#ffffff"/>
      <path d="M-30 12 L-15 -3 L2 7 L23 -14" fill="none"/>
      <circle cx="-30" cy="12" r="4" fill="#6144aa"/>
      <circle cx="-15" cy="-3" r="4" fill="#6144aa"/>
      <circle cx="2" cy="7" r="4" fill="#6144aa"/>
      <circle cx="23" cy="-14" r="4" fill="#6144aa"/>
      <path d="M0 28 V43 M-22 43 H22" fill="none"/>
    </g>
  </g>

  <!-- Scenario Comparison icon -->
  <g transform="translate(1392 292)">
    <circle r="64" fill="#f7e8ce" stroke="#ffffff" stroke-width="2"/>
    <g stroke="#d18413" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <g fill="#d99020">
        <circle cx="-25" cy="-27" r="10"/>
        <path d="M-38 -8 Q-25 -17 -12 -8 L-8 25 M-13 -5 L-14 46 M-37 -5 L-36 46 M-42 25 L-38 -8"/>
      </g>
      <g fill="none" stroke-dasharray="7 6">
        <circle cx="28" cy="-27" r="10"/>
        <path d="M15 -8 Q28 -17 41 -8 L45 25 M40 -5 L39 46 M16 -5 L17 46 M11 25 L15 -8"/>
      </g>
    </g>
  </g>

  <!-- Interpretive Focus icon -->
  <g transform="translate(595 810)">
    <circle r="64" fill="#dceff0" stroke="#ffffff" stroke-width="2"/>
    <g stroke="#14758a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-34" y="-42" width="68" height="92" rx="3" fill="#ffffff"/>
      <line x1="-20" y1="-23" x2="18" y2="-23"/>
      <line x1="-20" y1="-8" x2="12" y2="-8"/>
      <line x1="-20" y1="7" x2="10" y2="7"/>
      <line x1="-20" y1="22" x2="-2" y2="22"/>
      <circle cx="29" cy="20" r="25" fill="#fbfaf8"/>
      <line x1="47" y1="39" x2="65" y2="58" stroke-width="8"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="200" y="408" fill="#287637" font-size="34" font-weight="700">Data Sources</text>
    <text x="200" y="458" fill="#202733" font-size="25">
      <tspan x="200" dy="0">Anthropometric standard</tspan>
      <tspan x="200" dy="31">percentiles</tspan>
      <tspan x="200" dy="31">+ ANSUR II correlation</tspan>
      <tspan x="200" dy="31">structure</tspan>
    </text>

    <text x="595" y="408" fill="#2874b4" font-size="29" font-weight="700">Simulated Body Space</text>
    <text x="595" y="458" fill="#202733" font-size="25">
      <tspan x="595" dy="0">Generate two distributions</tspan>
      <tspan x="595" dy="31">of body measurements</tspan>
      <tspan x="595" dy="31">Preserve correlations</tspan>
      <tspan x="595" dy="31">among variables</tspan>
    </text>

    <text x="990" y="408" fill="#6144aa" font-size="34" font-weight="700">Reading Models</text>
    <text x="990" y="458" fill="#202733" font-size="25">
      <tspan x="990" dy="0">Logistic Regression /</tspan>
      <tspan x="990" dy="34">Random Forest</tspan>
      <tspan x="990" dy="34">XGBoost</tspan>
    </text>

    <text x="1392" y="408" fill="#c87508" font-size="27" font-weight="700">Scenario Comparison</text>
    <text x="1392" y="458" fill="#202733" font-size="25">
      <tspan x="1392" dy="0">Unmodified condition</tspan>
      <tspan x="1392" dy="37">Clothing-modified</tspan>
      <tspan x="1392" dy="31">condition</tspan>
    </text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="720" y="780" fill="#14758a" font-size="38" font-weight="700">Interpretive Focus</text>
    <text x="720" y="826" fill="#202733" font-size="25">
      <tspan x="720" dy="0">Distinguish between bodily variables in a</tspan>
      <tspan x="720" dy="33">measurement table and visible bodily</tspan>
      <tspan x="720" dy="33">information in everyday interaction</tspan>
    </text>
  </g>
</svg>
